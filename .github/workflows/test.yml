# push · PR 마다 시험을 돌린다.
#  · personal: 개인판 시험(tools/test.mjs) — 모의 호출 · 임시 자료 상자, 의존성 · 망 · 비밀값이 필요 없다.
#  · online:   온라인판 시험(online/test.mjs) — 실제 PostgreSQL(서비스 컨테이너)로. 시험용 DB 이름은 _test 로 끝나야 한다.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  personal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/test.mjs

  online:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: se
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: se_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U se -d se_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://se:ci-only-password@127.0.0.1:5432/se_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node online/test.mjs
